name: Prepare daily release draft

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Archived report date, YYYY-MM-DD (Asia/Shanghai)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: daily-release-${{ inputs.report_date }}
  cancel-in-progress: false

jobs:
  draft:
    # Only release content from the default branch, never an experimental branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate archive and create draft only
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/prepare_release.py
          --date "$REPORT_DATE"
          --repository "$GITHUB_REPOSITORY"
          --commit "$GITHUB_SHA"
          --create-draft
